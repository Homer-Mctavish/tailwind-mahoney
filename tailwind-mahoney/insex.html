<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Essential meta tag for responsive design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive 3-Column Layout with Adaptive Content</title>
  <style>
    /* Reset some defaults */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    /* Main container uses flex to create three columns */
    .container {
      display: flex;
      width: 100%;
      height: 100vh; /* Full viewport height */
    }

    /* Base styles for each column */
    .left,
    .middle,
    .right {
      padding: 10px;
    }

    /* Large & Medium screens: three columns in a row */
    @media (min-width: 768px) {
      .left {
        flex: 0 0 20%;       /* 20% of the width */
        background-color: #f8d7da;
      }
      .middle {
        flex: 0 0 60%;       /* 60% of the width */
        background-color: #d1ecf1;
        text-align: center;
      }
      .right {
        flex: 0 0 20%;       /* 20% of the width */
        background-color: #d4edda;
      }
    }

    /* Small screens: stack columns vertically */
    @media (max-width: 767px) {
      .container {
        flex-direction: column;
        height: auto; /* Let the container grow naturally */
      }
      .left, .middle, .right {
        flex: 1 1 auto;
        width: 100%;
      }
    }

    /* Adaptive content within the middle div */
    .middle .large-content {
      display: block;
    }
    .middle .medium-content,
    .middle .small-content {
      display: none;
    }

    /* Medium screens: show alternative content */
    @media (max-width: 1023px) and (min-width: 768px) {
      .middle .large-content {
        display: none;
      }
      .middle .medium-content {
        display: block;
      }
    }

    /* Small screens: show yet another variation */
    @media (max-width: 767px) {
      .middle .large-content,
      .middle .medium-content {
        display: none;
      }
      .middle .small-content {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      Left Column<br>
      (20% width)
    </div>
    <div class="middle">
      Middle Column<br>
      (60% width)
      <div class="large-content">
        <p>This content is visible on large screens.</p>
      </div>
      <div class="medium-content">
        <p>This content is visible on medium screens.</p>
      </div>
      <div class="small-content">
        <p>This content is visible on small screens (mobile).</p>
      </div>
    </div>
    <div class="right">
      Right Column<br>
      (20% width)
    </div>
  </div>
</body>
</html>
