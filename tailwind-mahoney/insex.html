<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fade Transition Slideshow</title>
  <style>
    /* Slideshow viewport */
    .slideshow-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 400px;
      margin: 20px auto;
      overflow: hidden;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    /* Each slide is positioned on top of each other */
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      z-index: 0;
    }
    /* The active slide is visible */
    .slide.active {
      opacity: 1;
      z-index: 1;
    }

    /* Navigation buttons container */
    .nav-buttons {
      text-align: center;
      margin-top: 15px;
    }

    /* Style for each navigation button */
    .nav-button {
      display: inline-block;
      width: 30px;
      height: 30px;
      margin: 0 5px;
      background-color: #ccc;
      border-radius: 50%;
      cursor: pointer;
      line-height: 30px;
      font-size: 14px;
      color: white;
      transition: background-color 0.3s;
    }
    .nav-button.active {
      background-color: #3498db;
    }
  </style>
</head>
<body>
  <!-- Slideshow container -->
  <div class="slideshow-container">
    <div class="slide active" style="background-image: url('https://via.placeholder.com/800x400/3498db/ffffff?text=Slide+1');">d</div>
    <div class="slide" style="background-image: url('https://via.placeholder.com/800x400/2ecc71/ffffff?text=Slide+2');">k</div>
    <div class="slide" style="background-image: url('https://via.placeholder.com/800x400/e74c3c/ffffff?text=Slide+3');">a</div>
    <div class="slide" style="background-image: url('https://via.placeholder.com/800x400/f1c40f/ffffff?text=Slide+4');">r</div>
    <div class="slide" style="background-image: url('https://via.placeholder.com/800x400/9b59b6/ffffff?text=Slide+5');">n</div>
  </div>

  <!-- Navigation buttons -->
  <div class="nav-buttons">
    <span class="nav-button active" data-index="0">1</span>
    <span class="nav-button" data-index="1">2</span>
    <span class="nav-button" data-index="2">3</span>
    <span class="nav-button" data-index="3">4</span>
    <span class="nav-button" data-index="4">5</span>
  </div>

  <!-- Import external JavaScript -->
  <script src="src/main.js"></script>
</body>
</html>
